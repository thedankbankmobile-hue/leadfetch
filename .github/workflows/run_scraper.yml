name: DBPR HVAC Scraper Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 1 * *'

jobs:
  run-dbpr-scraper:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Essential for pushing commits

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4.2.2 # Fixed version to resolve deprecation warning
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Explicitly pass checkout authentication token

      - name: Set up Python environment
        uses: actions/setup-python@v6 # Updated to v6 to clear Node.js runtime warning
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DBPR scraper script
        run: python scraper.py

      - name: Commit and push generated CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hillsborough_hvac_contractors.csv
          git diff --staged --quiet || (git commit -m "Automated update of DBPR contractor CSV data" && git push)
