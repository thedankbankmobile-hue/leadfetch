name: Run Sunbiz Tree Service Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Runs every Monday at 6:00 AM UTC

jobs:
  scrape-sunbiz:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi

      - name: Run Sunbiz Scraper
        run: python sunbiz_scraper.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hillsborough_tree_services_sunbiz.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update Hillsborough Tree Services Sunbiz list" && git push)
