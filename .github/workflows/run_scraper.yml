name: DBPR HVAC Scraper Pipeline

on:
  workflow_dispatch: # Allows manual trigger via the GitHub Actions tab
  schedule:
    - cron: '0 12 1 * *' # Runs automatically at 12:00 PM UTC on the 1st of every month

jobs:
  run-dbpr-scraper:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Grants permissions to commit generated files back to the repo

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & Playwright Browser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npx playwright install --with-deps chromium

      - name: Run DBPR scraper script
        run: python scraper.py

      - name: Commit and push generated CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f hillsborough_hvac_contractors.csv ]; then
            git add hillsborough_hvac_contractors.csv
            git diff --staged --quiet || (git commit -m "Automated update of DBPR contractor CSV data" && git push)
          else
            echo "CSV file missing. Skipping commit."
          fi
