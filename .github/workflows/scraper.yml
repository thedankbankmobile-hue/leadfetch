name: Run Multi-Industry Scraper

on:
  workflow_dispatch: # This allows you to trigger the scraper manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # 1. Grab your code from the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Python on the server
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install the required Python packages
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4

      # 4. Install the Chromium browser and its system dependencies
      - name: Install Playwright Browsers
        run: playwright install --with-deps chromium

      # 5. Run your script for all industries
      - name: Run Scraper
        # We pass "all" directly to the script so sys.argv[1] picks it up
        run: python multi_industry_scraper.py all

      # 6. Save the output folder so you can download the CSV files
      - name: Upload Scraped CSVs
        uses: actions/upload-artifact@v4
        with:
          name: sunbiz-scraped-data
          path: output/*.csv
